[package]
name = "wfx-desktop-shell"
version = "0.1.0"
description = "The WebFlix Desktop native shell (R08): window lifecycle, filesystem storage, contained webview surfaces, OS notifications, background task registry, OS share sheet, and the native-media engine process host."
authors = ["WebFlix"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "wfx_desktop_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
# R20-F — the BYOF import file picker: the platform's native open-file
# dialog (macOS/Windows native; GTK on Linux desktops). A platform with
# no dialog service answers the honest typed `unsupported` verdict.
rfd = "0.15"

# R22-H — the OS credential store for the session secret: the platform's
# REAL keychain (macOS Keychain / Windows Credential Manager / the Linux
# Secret Service) behind the auth-store area. A platform with no
# reachable service answers the honest typed `unsupported` verdict —
# never a silent fallback to plaintext storage.
keyring = "3"

# macOS share sheet backend (NSSharingServicePicker). Other platforms
# answer the honest `unsupported` outcome through the same seam (the
# adapter's canShare truthfully reports false there — see share.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSSharingServicePicker", "NSApplication", "NSWindow", "NSObject"] }
objc2-foundation = { version = "0.2", features = ["NSString", "NSArray", "NSValue"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
