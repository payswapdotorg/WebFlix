name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # PINNED to the version every gate proof on this track ran with
          # (bun 1.3.14 — lockfile format + workspace link layout verified).
          # "latest" resolved to 1.4.2 on 2026-09-15 and failed the run
          # (54s, gate step). Upgrade deliberately, never by drift.
          bun-version: 1.3.14
      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Contract drift check
        run: bun run contract-check
      - name: Lane boundary check
        run: bun run lane-check
      - name: Build web host (apps/web)
        run: bun run build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # R16 — the Web golden-journey check: boots the product's own
  # deterministic fixtures boot (WFX_DEV_FIXTURES=1, port 3101, the loud
  # dev-badge configuration; no external network — the fixture provider
  # URLs are .invalid and network-blocked by the harness) and runs every
  # CI-feasible encoded journey (the full encoded set: J01–J27, J29–J32;
  # J28 is explicitly listed not-run with its service-mode procedure in
  # the run manifest — never a silent skip). Any journey regression
  # (a failed assertion against the journey doc's expected states) fails
  # this job; evidence (manifest + screenshots + snapshots) is uploaded.
  journeys:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # PINNED to the version every gate proof on this track ran with
          # (bun 1.3.14 — lockfile format + workspace link layout verified).
          # Upgrade deliberately, never by drift.
          bun-version: 1.3.14
      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install agent-browser + browser
        run: |
          npm install -g agent-browser
          agent-browser install --with-deps
      - name: Web golden journeys (the CI-feasible set — failing on regression)
        run: bun run journeys:ci
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-evidence
          path: evidence/r16/
          if-no-files-found: warn
