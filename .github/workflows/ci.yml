name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # PINNED to the version every gate proof on this track ran with
          # (bun 1.3.14 — lockfile format + workspace link layout verified).
          # "latest" resolved to 1.4.2 on 2026-09-15 and failed the run
          # (54s, gate step). Upgrade deliberately, never by drift.
          bun-version: 1.3.14
      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Contract drift check
        run: bun run contract-check
      - name: Lane boundary check
        run: bun run lane-check
      - name: Build web host (apps/web)
        run: bun run build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
